[theme]
primaryColor = "#fbda03"
backgroundColor = "#0D0D0D"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"

[server]
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false
