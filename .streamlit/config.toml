[theme]
primaryColor = "#bdbdbd"
backgroundColor = "#111111"
secondaryBackgroundColor = "#1c1c1c"
textColor = "#f2f2f2"
font = "sans serif"

[server]
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false
